name: e2e
on:
  pull_request:
    paths-ignore: ["**.md"]
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [scan, personalize, askai, inline, tabs, removals, pip, sheet, again]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m venv "$RUNNER_TEMP/v" && "$RUNNER_TEMP/v/bin/pip" install -q playwright==1.63.0 curl_cffi
      - run: '"$RUNNER_TEMP/v/bin/playwright" install --with-deps chromium webkit'
      # stubs only: a network namespace with nothing but loopback and sudo's reset env, so no key is held and no paid API reachable
      - run: >-
          sudo unshare -n sh -c "ip link set lo up && exec sudo -u $(id -un) -H
          $RUNNER_TEMP/v/bin/python tools/scan_e2e.py $RUNNER_TEMP/out --no-reuse --only ${{ matrix.scenario }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.scenario }}
          path: ${{ runner.temp }}/out
          retention-days: 3
